<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cape Town Atlas — an interactive field guide</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0E11'/%3E%3Cpath d='M8 46 L24 20 L34 36 L42 26 L56 46 Z' fill='%23E0A45E'/%3E%3C/svg%3E" />
<meta name="description" content="A field guide to Cape Town you can fly through. Real 3D terrain and buildings, twelve districts, cinematic stories, and light that follows the real sun." />
<meta name="theme-color" content="#0B0E11" />
<meta property="og:title" content="Cape Town Atlas — an interactive field guide" />
<meta property="og:description" content="Real 3D terrain and buildings, twelve districts, cinematic stories, and light that follows the real sun." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
<link rel="preconnect" href="https://s3.amazonaws.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet" />
<link href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="stylesheet" href="./src/styles/tokens.css" />
<link rel="stylesheet" href="./src/styles/scene.css" />
<link rel="stylesheet" href="./src/styles/chrome.css" />
<link rel="stylesheet" href="./src/styles/rail.css" />
<link rel="stylesheet" href="./src/styles/dossier.css" />
<link rel="stylesheet" href="./src/styles/player.css" />
<link rel="stylesheet" href="./src/styles/mobile.css" />
</head>
<body>
<a class="skip-link" href="#rail">Skip to the atlas index</a>

<div class="app" id="app" data-panel="index" data-mode="wander">
  <!-- ─── the scene ─────────────────────────────────────────────── -->
  <div class="scene">
    <div id="map" class="scene__map"></div>
    <canvas class="scene__stars" id="stars" aria-hidden="true"></canvas>
    <div class="scene__grade" aria-hidden="true"></div>
    <div class="scene__beacons" id="beacons" aria-hidden="true"></div>
    <div class="scene__beacons" id="identify"></div>
    <div class="scene__letterbox" aria-hidden="true"></div>
  </div>

  <!-- ─── topbar ────────────────────────────────────────────────── -->
  <header class="topbar">
    <button class="brand" id="brandBtn" title="Back to the whole city">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><path d="M2 25 L10 10 L15 19 L19 13 L30 25 Z" fill="currentColor"/><circle cx="24" cy="7.5" r="3" fill="currentColor" opacity=".55"/></svg>
      </span>
      <span class="brand__text">
        <span class="brand__name">Cape&nbsp;Town&nbsp;Atlas</span>
        <span class="brand__sub">A field guide to the Mother City</span>
      </span>
    </button>

    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>

    <div class="topbar__tools">
      <button class="tbtn tbtn--search" id="searchBtn" aria-haspopup="dialog">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.8 12.8 L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="tbtn__label">Search</span>
        <kbd class="kbd" id="searchKbd">⌘K</kbd>
      </button>
      <button class="tbtn" id="timeBtn" aria-haspopup="dialog" aria-expanded="false">
        <span class="tbtn__glyph" id="timeGlyph">☀</span>
        <span class="tbtn__label" id="timeLabel">Now</span>
        <span class="tbtn__meta" id="timeMeta">14:20</span>
      </button>
      <button class="tbtn tbtn--icon" id="menuBtn" aria-haspopup="dialog" aria-expanded="false" aria-label="Atlas options">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="4" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/><circle cx="16" cy="10" r="1.6" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <!-- ─── the atlas index (left) ────────────────────────────────── -->
  <aside class="rail" id="rail" aria-label="Atlas index">
    <div class="rail__head">
      <div class="seg" role="tablist" aria-label="Browse by">
        <button class="seg__btn is-on" role="tab" id="tabPlaces" aria-selected="true" data-tab="places">Places</button>
        <button class="seg__btn" role="tab" id="tabDistricts" aria-selected="false" data-tab="districts">Districts</button>
        <button class="seg__btn" role="tab" id="tabStories" aria-selected="false" data-tab="stories">Stories</button>
      </div>
      <div class="rail__searchwrap">
        <button class="rail__search" id="railSearchBtn">
          <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.8 12.8 L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Search places, districts, stories…</span>
          <kbd class="kbd">⌘K</kbd>
        </button>
      </div>
      <div class="rail__filters" id="railFilters"></div>
    </div>
    <div class="rail__body" id="railBody" role="tabpanel"></div>
    <div class="rail__foot" id="railFoot"></div>
  </aside>

  <!-- ─── the dossier (right) ───────────────────────────────────── -->
  <aside class="dossier" id="dossier" aria-label="Place dossier" aria-hidden="true"></aside>

  <!-- ─── story player ──────────────────────────────────────────── -->
  <section class="player" id="player" aria-label="Story player" hidden></section>

  <!-- ─── map tools ─────────────────────────────────────────────── -->
  <div class="tools" id="tools">
    <button class="tool" id="compassBtn" title="Point north" aria-label="Point the camera north">
      <span class="compass" id="compassRose">
        <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
          <circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1"/>
          <path d="M20 5 L24 20 L20 35 L16 20 Z" fill="currentColor" opacity=".9"/>
          <text x="20" y="11.5" text-anchor="middle" font-size="7.5" fill="currentColor" font-family="var(--font-mono)">N</text>
        </svg>
      </span>
    </button>
    <div class="tool-group">
      <button class="tool" id="zoomInBtn" aria-label="Zoom in" title="Zoom in">+</button>
      <button class="tool" id="zoomOutBtn" aria-label="Zoom out" title="Zoom out">−</button>
    </div>
    <button class="tool" id="layersBtn" aria-label="Map layers" title="Layers" aria-expanded="false">◧</button>
    <button class="tool" id="photoBtn" aria-label="Photo mode" title="Photo mode (P)">◉</button>
  </div>

  <div class="layers-pop" id="layersPop" hidden></div>

  <!-- ─── attribution ───────────────────────────────────────────── -->
  <div class="attrib" id="attrib">
    <span class="attrib__scale" id="scaleText">1 km</span>
    <span class="attrib__sep"></span>
    <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap</a>
    <a href="https://openfreemap.org" target="_blank" rel="noreferrer">OpenFreeMap</a>
    <button id="aboutBtn">Data, sources &amp; design</button>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="hint" id="hint" aria-hidden="true"></div>

  <!-- ─── the opening shot ──────────────────────────────────────── -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro__bar"></div>
    <div class="intro__inner">
      <p class="intro__eyebrow">33.92° S · 18.42° E — Western Cape, South Africa</p>
      <h1 class="intro__title">Cape&nbsp;Town</h1>
      <p class="intro__line">A city pinned between a mountain and a harbour.<br />Thirty-six places, twelve districts, five routes through it.</p>
    </div>
    <div class="intro__skip">Move or press any key to begin</div>
  </div>

  <!-- ─── dialogs ───────────────────────────────────────────────── -->
  <dialog class="sheet-dialog" id="paletteDialog" aria-label="Search the atlas"></dialog>
  <dialog class="sheet-dialog sheet-dialog--doc" id="aboutDialog" aria-label="About this atlas"></dialog>
  <dialog class="sheet-dialog sheet-dialog--light" id="timeDialog" aria-label="Time of day and light"></dialog>

  <div class="loading" id="loading">
    <div class="loading__inner">
      <span class="loading__spinner" aria-hidden="true"></span>
      <span class="loading__text" id="loadingText">Raising the mountain…</span>
    </div>
  </div>
</div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
